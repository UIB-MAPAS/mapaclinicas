<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Clínicas — Broker de Seguros</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ─── Reset & base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f0f2f5;
      color: #1a1a2e;
    }

    /* ─── Sidebar ───────────────────────────────────────────────────────── */
    #sidebar {
      width: 360px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      box-shadow: 2px 0 12px rgba(0,0,0,.12);
      z-index: 1000;
      overflow: hidden;
    }

    #sidebar-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      padding: 18px 20px 14px;
      flex-shrink: 0;
    }
    #sidebar-header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .4px;
      margin-bottom: 3px;
    }
    #sidebar-header p {
      font-size: 11px;
      opacity: .65;
    }

    #sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ─── Search card ───────────────────────────────────────────────────── */
    .card {
      background: #f8f9fb;
      border: 1px solid #e4e7ed;
      border-radius: 10px;
      padding: 14px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: #6b7280;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-title .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      display: inline-block;
    }

    #search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color .2s;
      background: #fff;
    }
    #search-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }

    #btn-search {
      margin-top: 8px;
      width: 100%;
      padding: 10px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    #btn-search:hover { background: #c0392b; }
    #btn-search:active { transform: scale(.98); }
    #btn-search:disabled { background: #9ca3af; cursor: not-allowed; }

    /* ─── Status / loading ──────────────────────────────────────────────── */
    #status-bar {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      border-left: 3px solid #3b82f6;
      display: none;
    }
    #status-bar.error { background: #fef2f2; color: #b91c1c; border-color: #ef4444; }
    #status-bar.success { background: #f0fdf4; color: #15803d; border-color: #22c55e; }
    #status-bar.show { display: block; }

    /* Loading overlay on map */
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      gap: 12px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { font-size: 13px; color: #6b7280; }
    #loading-progress { font-size: 11px; color: #9ca3af; }

    /* ─── Results ───────────────────────────────────────────────────────── */
    #results-container { display: none; }
    #results-container.show { display: block; }

    .accident-info {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #7f1d1d;
    }
    .accident-info strong { display: block; font-size: 13px; margin-bottom: 2px; }

    .clinic-item {
      background: #fff;
      border: 1px solid #e4e7ed;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: box-shadow .2s;
      cursor: pointer;
    }
    .clinic-item:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); border-color: #93c5fd; }
    .clinic-rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px; height: 22px;
      background: #1e40af;
      color: #fff;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .clinic-header { display: flex; align-items: center; margin-bottom: 6px; }
    .clinic-name { font-weight: 600; font-size: 13px; flex: 1; }
    .clinic-distance {
      font-size: 12px;
      font-weight: 700;
      color: #059669;
      background: #d1fae5;
      padding: 2px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .clinic-detail { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .clinic-phone { font-size: 12px; color: #374151; margin-top: 4px; }
    .btn-route {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
    }
    .btn-route:hover { background: #1d4ed8; }

    /* ─── Legend ────────────────────────────────────────────────────────── */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 12px;
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(0,0,0,.15);
    }

    /* Toggle locales */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #374151;
    }
    .toggle-switch {
      position: relative;
      width: 36px; height: 20px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #d1d5db;
      border-radius: 20px;
      transition: .3s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      background: #fff;
      border-radius: 50%;
      left: 3px; top: 3px;
      transition: .3s;
    }
    input:checked + .toggle-slider { background: #3b82f6; }
    input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* ─── Map container ─────────────────────────────────────────────────── */
    #map-wrapper {
      flex: 1;
      position: relative;
    }
    #map { width: 100%; height: 100%; }

    /* ─── Leaflet popup tweaks ──────────────────────────────────────────── */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
    }
    .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .popup-row { font-size: 12px; color: #374151; margin-bottom: 2px; }
    .popup-aass {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }

    /* ─── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; min-width: unset; max-height: 45vh; }
      #map-wrapper { flex: 1; min-height: 55vh; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════ SIDEBAR ════════════════════════════════════════ -->
<aside id="sidebar">
  <div id="sidebar-header">
    <h1>🗺 Mapa de Clínicas Afiliadas</h1>
    <p>Broker de seguros · Orientación de accidentados</p>
  </div>

  <div id="sidebar-body">

    <!-- Buscar accidente -->
    <div class="card">
      <div class="card-title"><span class="dot"></span>Ubicar accidente</div>
      <input
        id="search-input"
        type="text"
        placeholder="Ej: Av. Javier Prado Este 2465, San Isidro"
        autocomplete="off"
      />
      <button id="btn-search" onclick="searchAccident()">
        Buscar clínicas cercanas
      </button>
    </div>

    <!-- Status messages -->
    <div id="status-bar"></div>

    <!-- Results -->
    <div id="results-container">
      <div class="card-title" style="padding:0 2px 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Clínicas más cercanas
      </div>
      <div id="accident-info" class="accident-info"></div>
      <div id="clinics-list"></div>
    </div>

    <!-- Controles -->
    <div class="card">
      <div class="card-title">Controles</div>
      <div class="toggle-row">
        <span>Mostrar locales asegurados</span>
        <label class="toggle-switch">
          <input id="toggle-locales" type="checkbox" checked onchange="toggleLocales(this.checked)" />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Legend -->
    <div class="card" id="legend-card">
      <div class="card-title">Asesores (AASS)</div>
      <div id="legend-items">
        <div style="font-size:11px;color:#9ca3af">Cargando locales…</div>
      </div>
    </div>

  </div><!-- /sidebar-body -->
</aside>

<!-- ═══════════════════════ MAP ═════════════════════════════════════════════ -->
<div id="map-wrapper">
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Iniciando mapa…</div>
    <div id="loading-progress"></div>
  </div>
  <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- PapaParse CSV parser -->
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<!-- App logic -->
<script src="js/app.js"></script>

</body>
</html>
